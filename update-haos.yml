---
# ============================================================
# PLAY 1 - Back up Home Assistant VM 108 to PBS
# ============================================================

- name: Back up Home Assistant VM before updates
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true

  vars:
    # Proxmox / PBS settings supplied by Semaphore Environment
    pve_host: "{{ lookup('env', 'pve_host') }}"
    pve_user: "{{ lookup('env', 'pve_user') }}"
    pve_token_id: "{{ lookup('env', 'pve_token_id') }}"
    pve_token_secret: "{{ lookup('env', 'PVE_TOKEN_SECRET') }}"
    pbs_storage: "{{ lookup('env', 'pbs_storage') }}"

    ha_vmid: 108

    backup_mode: "snapshot"
    backup_desc: "Home Assistant pre-update backup"
    wait_timeout_seconds: 7200

  tasks:

    - name: Verify required Proxmox/PBS settings are present
      ansible.builtin.assert:
        that:
          - pve_host | length > 0
          - pve_user | length > 0
          - pve_token_id | length > 0
          - pve_token_secret | length > 0
          - pbs_storage | length > 0
        fail_msg: >
          Required Proxmox/PBS environment variables are missing.
          Home Assistant maintenance has been cancelled.
        success_msg: "Proxmox/PBS configuration validated."

    - name: Back up Home Assistant VM 108 to PBS
      community.proxmox.proxmox_backup:
        api_host: "{{ pve_host }}"
        api_user: "{{ pve_user }}"
        api_token_id: "{{ pve_token_id }}"
        api_token_secret: "{{ pve_token_secret }}"
        validate_certs: false

        storage: "{{ pbs_storage }}"
        mode: include
        vmids:
          - "{{ ha_vmid }}"

        backup_mode: "{{ backup_mode }}"
        compress: zstd
        description: "{{ backup_desc }}"

        wait: true
        wait_timeout: "{{ wait_timeout_seconds }}"

      register: ha_vm_backup

    - name: Verify Home Assistant VM backup completed successfully
      ansible.builtin.assert:
        that:
          - ha_vm_backup is succeeded
        fail_msg: >
          Home Assistant VM backup failed.
          No Home Assistant updates will be performed.
        success_msg: >
          Home Assistant VM 108 backup completed successfully.


# ============================================================
# PLAY 2 - Update Home Assistant
# ============================================================

- name: Update Home Assistant OS installation
  hosts: homeassistant
  gather_facts: false
  any_errors_fatal: true

  vars:
    # Terminal & SSH is the connection being used by Ansible.
    # Do not try to update it during this session.
    excluded_apps:
      - core_ssh

  tasks:

    # ========================================================
    # Initial health check
    # ========================================================

    - name: Verify Home Assistant CLI is available
      ansible.builtin.raw: ha info
      register: ha_initial_info
      changed_when: false

    - name: Show current Home Assistant information
      ansible.builtin.debug:
        var: ha_initial_info.stdout_lines


    # ========================================================
    # Supervisor
    # ========================================================

    - name: Get Supervisor update information
      ansible.builtin.raw: ha supervisor info --no-progress --raw-json
      register: supervisor_info_raw
      changed_when: false

    - name: Parse Supervisor information
      ansible.builtin.set_fact:
        supervisor_info: "{{ supervisor_info_raw.stdout | trim | from_json }}"

    - name: Show Supervisor version
      ansible.builtin.debug:
        msg: >-
          Supervisor:
          installed={{ supervisor_info.data.version }},
          latest={{ supervisor_info.data.version_latest }},
          update_available={{ supervisor_info.data.update_available }}

    - name: Update Supervisor
      ansible.builtin.raw: ha supervisor update --no-progress
      when: supervisor_info.data.update_available | bool
      register: supervisor_update

    - name: Wait for Supervisor after update
      ansible.builtin.raw: ha supervisor info --no-progress --raw-json
      register: supervisor_wait
      changed_when: false
      retries: 30
      delay: 10
      until: supervisor_wait.rc == 0
      when: supervisor_info.data.update_available | bool


    # ========================================================
    # Home Assistant Core
    # ========================================================

    - name: Get Home Assistant Core update information
      ansible.builtin.raw: ha core info --no-progress --raw-json
      register: core_info_raw
      changed_when: false

    - name: Parse Home Assistant Core information
      ansible.builtin.set_fact:
        core_info: "{{ core_info_raw.stdout | trim | from_json }}"

    - name: Show Home Assistant Core version
      ansible.builtin.debug:
        msg: >-
          Home Assistant Core:
          installed={{ core_info.data.version }},
          latest={{ core_info.data.version_latest }},
          update_available={{ core_info.data.update_available }}

    - name: Update Home Assistant Core with partial HA backup
      ansible.builtin.raw: ha core update --backup --no-progress
      when: core_info.data.update_available | bool
      register: core_update

    - name: Wait for Home Assistant Core after update
      ansible.builtin.raw: ha core info --no-progress --raw-json
      register: core_wait
      changed_when: false
      retries: 60
      delay: 10
      until:
        - core_wait.rc == 0
        - (core_wait.stdout | trim | from_json).data.state == "running"
      when: core_info.data.update_available | bool


    # ========================================================
    # Home Assistant Apps
    # ========================================================

    - name: Get Home Assistant app list
      ansible.builtin.raw: ha apps list --no-progress --raw-json
      register: apps_info_raw
      changed_when: false

    - name: Parse Home Assistant app information
      ansible.builtin.set_fact:
        apps_info: "{{ apps_info_raw.stdout | trim | from_json }}"

    # Handles both current "apps" naming and older "addons"
    # response naming for compatibility.
    - name: Build installed app list
      ansible.builtin.set_fact:
        installed_apps: >-
          {{
            apps_info.data.apps
            | default(apps_info.data.addons | default([]))
          }}

    - name: Build list of apps requiring updates
      ansible.builtin.set_fact:
        apps_to_update: >-
          {{
            installed_apps
            | selectattr('update_available', 'defined')
            | selectattr('update_available', 'equalto', true)
            | selectattr('version', 'defined')
            | rejectattr('version', 'equalto', none)
            | rejectattr('slug', 'in', excluded_apps)
            | list
          }}

    - name: Show apps requiring updates
      ansible.builtin.debug:
        msg: >-
          Apps to update:
          {{
            apps_to_update
            | map(attribute='name')
            | list
          }}

    - name: Update Home Assistant apps
      ansible.builtin.raw: >
        ha apps update {{ item.slug }} --no-progress
      loop: "{{ apps_to_update }}"
      loop_control:
        label: "{{ item.name }}"


    # ========================================================
    # Home Assistant OS
    # ========================================================

    - name: Get Home Assistant OS update information
      ansible.builtin.raw: ha os info --no-progress --raw-json
      register: os_info_raw
      changed_when: false

    - name: Parse Home Assistant OS information
      ansible.builtin.set_fact:
        os_info: "{{ os_info_raw.stdout | trim | from_json }}"

    - name: Show Home Assistant OS version
      ansible.builtin.debug:
        msg: >-
          Home Assistant OS:
          installed={{ os_info.data.version }},
          latest={{ os_info.data.version_latest }},
          update_available={{ os_info.data.update_available }}

    - name: Install Home Assistant OS update
      ansible.builtin.raw: ha os update --no-progress
      when: os_info.data.update_available | bool
      register: os_update


    # ========================================================
    # Reboot after HAOS update
    # ========================================================

    - name: Reboot Home Assistant after OS update
      ansible.builtin.raw: ha host reboot
      when: os_info.data.update_available | bool
      register: ha_reboot
      failed_when: false

    - name: Wait for SSH to go offline
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ ansible_port | default(22) }}"
        state: stopped
        timeout: 180
      delegate_to: localhost
      when: os_info.data.update_available | bool

    - name: Wait for SSH to return
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ ansible_port | default(22) }}"
        state: started
        delay: 10
        timeout: 900
      delegate_to: localhost
      when: os_info.data.update_available | bool


    # ========================================================
    # Final health check
    # ========================================================

    - name: Wait for Home Assistant CLI to become available
      ansible.builtin.raw: ha info
      register: final_ha_info
      changed_when: false
      retries: 60
      delay: 10
      until: final_ha_info.rc == 0

    - name: Verify Home Assistant is running
      ansible.builtin.raw: ha info --no-progress --raw-json
      register: final_ha_health
      changed_when: false
      retries: 30
      delay: 10
      until:
        - final_ha_health.rc == 0
        - (final_ha_health.stdout | trim | from_json).data.state == "running"

    - name: Display final Home Assistant status
      ansible.builtin.debug:
        var: final_ha_info.stdout_lines

    - name: Home Assistant maintenance completed
      ansible.builtin.debug:
        msg: >
          Home Assistant VM 108 was backed up successfully and
          all applicable Home Assistant platform updates completed.
